# ──────────────────────────────────────────────────────────
# CD Pipeline — Ticketing Modular Monolith
# Runs when CI workflow completes successfully on main (or manual dispatch)
# Steps: build & cache image → push to GHCR → deploy via SSH & health check
# ──────────────────────────────────────────────────────────

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cd-vps-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/ticketing-api" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        if: ${{ secrets.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_APP_DIR }}

            # Đăng nhập GHCR trên VPS để tải image mới nhất
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Kéo image mới
            docker compose pull ticketing-api

            # Khởi động / tái tạo container API với image mới
            docker compose up -d ticketing-api

            # Kiểm tra trạng thái sức khỏe dịch vụ (tối đa 30 giây)
            echo "Đang kiểm tra Health check tại http://localhost:8080/health..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "Deploy thành công! Health check OK."
                docker image prune -f
                exit 0
              fi
              echo "Đang chờ API sẵn sàng ($i/15)..."
              sleep 2
            done

            echo "LỖI: Health check thất bại sau khi khởi động!"
            docker compose logs --tail=50 ticketing-api
            exit 1
