# ──────────────────────────────────────────────────────────
# CI Pipeline — Ticketing Modular Monolith
# Runs on every push and PR to main/develop
# Steps: restore → build → arch tests → Docker build → admin-ui E2E
# ──────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, Test & Architecture Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore -c Release

      - name: Non-generic Result factory check
        run: bash ../scripts/check-bare-result.sh

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Run Architecture Tests
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --no-build -c Release --verbosity normal

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t ticketing-api:ci .

      # Verify csproj in Dockerfile — if new project added but COPY missing, fail here
      - name: Verify container starts
        run: |
          docker run -d --name ci-test \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:8080 \
            ticketing-api:ci
          sleep 5
          docker logs ci-test
          docker stop ci-test
          docker rm ci-test

  admin-ui:
    name: Admin UI Build & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - name: Build (type-check + bundle)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests (boots Orders.Api + mock Ticketing + UI)
        run: npm run test:e2e