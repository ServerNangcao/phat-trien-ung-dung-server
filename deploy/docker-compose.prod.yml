# ──────────────────────────────────────────────────────────
# Production Docker Compose — Ticketing System
# Multi-Schema PostgreSQL + Redis + Backend API (GHCR)
# Memory limits aligned with Architecture Plan
# ──────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL Database ───
  ticketing-db:
    image: postgres:18-alpine
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-ticketing_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketing_app} -d ${POSTGRES_DB:-ticketing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ───
  ticketing-redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ───
  ticketing-api:
    image: ${TICKETING_API_IMAGE:-ghcr.io/${GITHUB_REPOSITORY:-owner/ticketing}/ticketing-api:latest}
    restart: always
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: Host=ticketing-db;Port=5432;Database=${POSTGRES_DB:-ticketing};Username=${POSTGRES_USER:-ticketing_app};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: ticketing-redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__Hangfire: Host=ticketing-db;Port=5432;Database=${POSTGRES_DB:-ticketing};Username=${POSTGRES_USER:-ticketing_app};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-ticketing-api}
      Jwt__Audience: ${JWT_AUDIENCE:-ticketing-client}
      # Cloudflare R2 S3 Object Storage
      S3__ServiceUrl: ${S3_SERVICE_URL}
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__BucketName: ${S3_BUCKET_NAME:-ticketing}
      S3__PublicUrl: ${S3_PUBLIC_URL}
      S3__ForcePathStyle: "false"
    depends_on:
      ticketing-db:
        condition: service_healthy
      ticketing-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 640M

volumes:
  pgdata:
